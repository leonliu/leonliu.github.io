remote_theme: mmistakes/minimal-mistakes@4.24.0

minimal_mistakes_skin: "air" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# site settings
locale: "en-US"
title: "Leon Liu"
title_separator: "-"
subtitle: "Indie developer · curious about many things"
name: &name "Leon Liu" # &name is a YAML anchor which can be *referenced later
description: &description "Notes on software, things I'm curious about, and products I build."
url: "https://leonliu.github.io"
repository: "leonliu/leonliu.github.io"
teaser: "/assets/img/teaser.jpeg" # path of fallback teaser image
logo: "/assets/img/logo.png"

# masthead_title: # overrides the website title displayed in the masthead, use " " for no title
# breadcrumbs            : false # true, false (default)

words_per_minute: 200

atom_feed:
  path: # blank (default) uses feed.xml

search: true # true, false (default)
search_full_content: true # true, false (default)
search_provider: lunr

# comment
comments:
  provider: "disqus"
  disqus:
    shortname: "leonliu-github-io"

# Site Author
author:
  name: "Leon Liu"
  avatar: "/assets/img/avatar.png"
  bio: "Programmer, music lover and mountaineer."
  location: "Auckland, NZ"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:liu.l.leon@gmail.com"
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://leonliu.github.io"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/l14967"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/leonliu"

# Site Footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/leonliu"

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: true
      show_date: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false
      comments: false

include:
  - _pages

main:
  - title: "Writing"
    url: /blog/
  - title: "Products"
    url: /products/
  - title: "Support"
    url: /support/
  - title: "About"
    url: /about/
  - title: "Contact"
    url: /contact/

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-feed